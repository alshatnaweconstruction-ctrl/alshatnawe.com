name: Bug report
description: Something does not work as expected
title: "bug: "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, error text, screenshots, run links. Remove secrets and personal data first.
  - type: dropdown
    id: priority
    attributes:
      label: Impact
      options:
        - "P0: live system broken or data at risk"
        - "P1: important, needs a fix soon"
        - "P2: normal"
        - "P3: minor"
    validations:
      required: true
